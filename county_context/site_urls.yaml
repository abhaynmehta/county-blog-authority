# Known County Group URLs.
#
# Anything an audit finds that is not listed here is reported as "needs
# verification" — not as an error. The audit runs offline and cannot know
# whether an unlisted URL resolves; `searchctl-agent links` checks that over
# the network.
#
# Source: supplied by Abhay Mehta, 29 Aug 2026.

