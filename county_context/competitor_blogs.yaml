# Blog indexes and articles benchmarked against.
#
# Competitors are measured, never treated as sources of fact: a rival's page
# is evidence of what they publish, not of what is true. Nothing here feeds
# the truth registry.
#
# Sites that render their article links in JavaScript cannot be discovered by
# a plain fetch, so those carry an explicit `articles` list instead. Where
# both are present the explicit list wins.
#
# Every entry was fetched and its state recorded on 29 Aug 2026.

own:
  - https://www.countygroup.in/blog/

pages_per_site: 5

competitors:
  - name: Prateek Group
    blog: https://prateekgroup.com/blog/
    discovery: automatic
    verified: 2026-08-29

  - name: Ace Group
    blog: https://acegroupindia.com/blog/
    discovery: automatic
    verified: 2026-08-29
    note: 16 articles discoverable; the largest competitor corpus available.

  - name: Eldeco
    blog: https://www.eldecogroup.com/blogs/
    discovery: explicit
    verified: 2026-08-29
    note: >
      The index returns 200 but contains no article links — they are
      rendered client-side. URLs supplied by Abhay Mehta.
    articles:
      - https://www.eldecogroup.com/blogs/eldeco's-green-vision:-creating-oxygen-rich-sustainable-communities
      - https://www.eldecogroup.com/blogs/greater-noida's-real-estate-boom:-why-now-is-the-best-time-to-invest-in-eldeco-7-peaks
      - https://www.eldecogroup.com/blogs/from-concept-to-creation:-how-eldeco-delivers-unmatched-real-estate-excellence
      - https://www.eldecogroup.com/blogs/eldeco's-commitment-to-quality:-delivering-timeless-homes-for-40+-years

  - name: Gaursons India
    blog: https://www.gaursonsindia.com/blog.php
    discovery: explicit
    verified: 2026-08-29
    note: >
      blog.php lists only navigation links; articles sit at the site root as
      .php pages and are not linked from a crawlable index. URLs supplied by
      Abhay Mehta.
    articles:
      - https://www.gaursonsindia.com/why-smart-investors-are-quietly-betting-on-the-yamuna-expressway.php
      - https://www.gaursonsindia.com/a-decade-of-excellence-celebrating-10-years-of-gaurs-international-school.php
      - https://www.gaursonsindia.com/exclusive-living-the-rise-of-luxury-flats-in-noida-s-premier-neighborhoods.php
      - https://www.gaursonsindia.com/blog-gaur-city-one-of-the-top-townships-in-greater-noida.php

unavailable:
  - name: Godrej Properties
    blog: https://www.godrejproperties.com/
    status: robots_disallowed
    verified: 2026-08-29
    note: >
      Their robots.txt disallows our user agent, so we do not fetch it.
      Compare by hand in a browser rather than overriding robots.

  - name: ATS Group
    blog: https://www.atsgreens.com/blog/
    status: no_articles_found
    verified: 2026-08-29
    note: Index returns 200 but exposes only pagination links.

  - name: Elite Group
    blog: https://www.elitegroup.co.in/blog/
    status: not_found
    verified: 2026-08-29
    note: 404. Needs the correct domain or blog path.
